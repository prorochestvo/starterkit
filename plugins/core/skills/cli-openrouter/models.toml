# Curated model catalog. Country codes are ISO 3166-1 alpha-3 (lowercase),
# indicating developer origin, not API hosting location.
# destination describes intended uses; cost_tier is an approximate owner-editable category.
# cost_tier: cheap | moderate | expensive. Missing cost_tier means not assessed.
# IDs are copied from the supplied catalog; empty IDs must be verified before use.
# Listing a model does not authorize paid OpenRouter calls.
#
# score: mean rating (1-10) for review and reasoning work from a 2026-10-26 survey of five
# models (fable, opus, sol, astra, grok); score_n: how many of them rated the entry. A
# preliminary opinion, not a benchmark: entries with score_n below 3 are weakly supported,
# and entries without score were rated by none.
#
# Preliminary picks by task (models with an id, cheapest adequate first):
#   mechanical, quick-check: deepseek_flash, qwen36_flash (or the CLI's free tier)
#   code-review, alternative-review: deepseek_v32, kimi_k25; stronger: grok, gemini_pro
#   architecture, reasoning: deepseek_v4_pro; stronger: grok, qwen38_max
#   large-context: kimi_k25; stronger: gemini_pro, kimi_k3
#   opus, fable, sol, astra: through their subscriptions (Claude Code, Codex); here only
#   as a fallback when that lane is down.

